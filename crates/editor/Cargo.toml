[package]
name = "scrinx-editor"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[example]]
name = "decode-benchmark"
path = "examples/decode-benchmark.rs"

[[example]]
name = "playback-pipeline-benchmark"
path = "examples/playback-pipeline-benchmark.rs"

[[example]]
name = "editor-playback-benchmark"
path = "examples/editor-playback-benchmark.rs"

[[example]]
name = "editor-startup-benchmark"
path = "examples/editor-startup-benchmark.rs"

[dependencies]
scrinx-utils = { path = "../utils" }
scrinx-media = { path = "../media" }
scrinx-project = { path = "../project" }
scrinx-rendering = { path = "../rendering" }
scrinx-audio = { path = "../audio" }
scrinx-media-info = { path = "../media-info" }

tokio = { workspace = true, features = ["macros", "process", "fs"] }
cpal.workspace = true
axum = { version = "0.7.5", features = ["ws"] }
ffmpeg.workspace = true
specta.workspace = true
serde = { workspace = true }
serde_json = "1.0"
image = "0.25.2"
tempfile = "3"
sentry.workspace = true
futures = { workspace = true }
tracing.workspace = true
flume.workspace = true
tokio-util = "0.7.15"
ringbuf = "0.4.8"
lru = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Media"] }

[dev-dependencies]
scrinx-audio = { path = "../audio", features = ["test-support"] }
scrinx-enc-ffmpeg = { path = "../enc-ffmpeg" }
